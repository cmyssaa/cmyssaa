<style>
    /* Footer 專屬樣式 */
    .footer-col a.info-link {
        color: #ffffff;
        text-decoration: none;
        transition: color 0.2s ease-in-out;
    }

    .footer-col a.info-link:hover {
        color: #d4af37; /* 懸停時轉換為金黃色 */
    }

    /* 水平排列容器 (預設居中，首頁將由 JS 動態改為 left) */
    .footer-single-row {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 10px;
    }

    .footer-info-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    /* 圓形圖示標籤樣式 (四個項目統一風格) */
    .footer-social-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        color: #ffffff !important;
        font-size: 0.85rem;
        text-decoration: none;
        transition: all 0.25s ease;
    }

    .footer-social-badge:hover {
        transform: translateY(-2px) scale(1.1);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 各圖示專屬底色 */
    .footer-social-badge.loc-badge {
        background-color: #d4af37; /* 地址：聖潔金 */
        color: #003366 !important;
    }

    .footer-social-badge.mail-badge {
        background-color: #555555; /* 電郵：簡約灰 */
    }

    .footer-social-badge.wa-badge {
        background-color: #25d366; /* WhatsApp：品牌綠 */
    }

    .footer-social-badge.fb-badge {
        background-color: #1877f2; /* Facebook：品牌藍 */
    }

    /* 分隔線 */
    .footer-divider {
        color: rgba(255, 255, 255, 0.4);
    }

    /* 電腦版預設顯示文字 */
    .item-text {
        display: inline;
    }

    /* 手機版排版：順序同電腦版，全純 Icon 顯示 */
    @media (max-width: 768px) {
        .footer-single-row {
            gap: 12px; /* 圖示間距 */
        }

        /* 手機版隱藏所有項目的文字 */
        .item-text {
            display: none !important;
        }

        /* 手機版無需換行標籤 */
        .footer-break-mobile {
            display: none;
        }
    }
</style>

<script>
    // 自動判斷當前頁面：若為 index.html，聯絡資訊與容器靠左對齊
    (function alignFooterForIndex() {
        const path = window.location.pathname.split("/").pop();
        if (path === "index.html" || path === "" || path === "index_2.html") {
            const containerBox = document.getElementById("footer-container-box");
            const rowBox = document.getElementById("footer-row-box");
            if (containerBox) {
                containerBox.style.justifyContent = "flex-start";
                containerBox.style.textAlign = "left";
            }
            if (rowBox) {
                rowBox.style.justifyContent = "flex-start";
            }
        }
    })();
</script>
