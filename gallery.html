<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相簿 | 天主教鳴遠中學校友會</title>
    <meta name="description" content="天主教鳴遠中學校友會相簿：75、65、55 周年校慶及台灣行活動照片。">
    <meta property="og:title" content="相簿 | 天主教鳴遠中學校友會">
    <meta property="og:description" content="珍藏經典時刻 ‧ 記錄鳴遠回憶">
    <meta property="og:type" content="website">
    <meta property="og:image" content="logo.png">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="layout.js" defer></script>
</head>
<body class="page-gallery">

    <div id="site-header"></div>
    <noscript>
        <nav><a href="index.html">首頁</a> · <a href="gallery.html">相簿</a></nav>
    </noscript>

    <section class="page-banner banner-photo">
        <h2>相簿</h2>
        <p>珍藏經典時刻 ‧ 記錄鳴遠回憶</p>
    </section>

    <main class="container" id="main-content">
        <div id="gallery-panel" class="dynamic-panel">
            <div class="dynamic-panel-header">
                <h4 id="panel-title">相冊展示</h4>
                <div class="panel-action-btns">
                    <button type="button" class="share-btn" id="copy-album-btn">🔗 複製連結</button>
                    <button type="button" class="close-panel-btn" id="close-album-btn">✕ 關閉相冊</button>
                </div>
            </div>
            <div id="panel-content"></div>
        </div>

        <div id="default-gallery-grid" class="gallery-grid" aria-live="polite"></div>
    </main>

    <div id="main-lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="照片預覽" hidden>
        <button type="button" class="close-btn" id="lightbox-close" aria-label="關閉預覽">&times;</button>
        <button type="button" class="nav-btn prev-btn" id="lightbox-prev" aria-label="上一張">&#10094;</button>
        <button type="button" class="nav-btn next-btn" id="lightbox-next" aria-label="下一張">&#10095;</button>
        <img id="lightboxImg" src="" alt="放大照片">
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>

    <div id="share-toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="site-footer"></div>

    <script>
        let currentPhotoList = [];
        let currentPhotoIndex = 0;
        let currentFolder = '';
        let currentAlbumKey = '';
        let lastFocus = null;
        let skipNextPop = false;
        let albumTitles = {};

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function resolveGalleryImage(imagePath) {
            if (!imagePath) return 'campus.jpg';
            try {
                return new URL(imagePath, document.baseURI).href;
            } catch (error) {
                return 'campus.jpg';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('share-toast');
            toast.textContent = message;
            toast.hidden = false;
            setTimeout(() => { toast.hidden = true; }, 2200);
        }

        function createAlbumLink(link) {
            const anchor = document.createElement('a');
            anchor.className = 'sub-btn';
            anchor.textContent = link.label || '';

            if (link.album) {
                anchor.href = `gallery.html?${encodeURIComponent(link.album)}`;
                anchor.dataset.album = link.album;
            } else if (link.url) {
                anchor.href = link.url;
                anchor.target = '_blank';
                anchor.rel = 'noopener noreferrer';
                anchor.classList.add('fb-btn');
            }

            return anchor;
        }

        function renderGalleryList(albums) {
            const grid = document.getElementById('default-gallery-grid');
            grid.replaceChildren();

            albums.forEach((album) => {
                const firstLink = album.links?.find((link) => link.album || link.url);
                const coverLink = album.album ? { album: album.album } : album.url ? { url: album.url } : firstLink;
                if (!coverLink?.album && !coverLink?.url) return;
                const item = document.createElement(coverLink?.album || coverLink?.url ? 'a' : 'div');
                item.className = 'gallery-item';
                if (coverLink?.album) {
                    item.href = `gallery.html?${encodeURIComponent(coverLink.album)}`;
                    item.dataset.album = coverLink.album;
                } else if (coverLink?.url) {
                    item.href = coverLink.url;
                    item.target = '_blank';
                    item.rel = 'noopener noreferrer';
                }

                const info = document.createElement('div');
                info.className = 'gallery-info';

                const title = document.createElement('div');
                title.className = 'gallery-title';
                title.textContent = album.title || '';
                info.appendChild(title);

                if (album.date) {
                    const date = document.createElement('div');
                    date.className = `gallery-date${album.links?.length ? '' : ' gallery-date-separated'}`;
                    date.textContent = `📅 ${album.date}`;
                    info.appendChild(date);
                }

                if (album.links?.length) {
                    const linksContainer = document.createElement('div');
                    linksContainer.className = 'inline-links-container';
                    const date = info.querySelector('.gallery-date');
                    if (date) linksContainer.appendChild(date);

                    const links = document.createElement('div');
                    links.className = 'sub-links-inline';
                    album.links.forEach((link) => links.appendChild(createAlbumLink(link)));
                    linksContainer.appendChild(links);
                    info.appendChild(linksContainer);
                }

                const image = document.createElement('img');
                image.src = resolveGalleryImage(album.image);
                image.alt = album.alt || album.title || '相簿';
                item.appendChild(image);
                item.appendChild(info);
                grid.appendChild(item);
            });
        }

        async function loadGalleryList() {
            const grid = document.getElementById('default-gallery-grid');
            try {
                const response = await fetch('gallery/gallery.json');
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const data = await response.json();
                const albums = Array.isArray(data) ? data : data.albums;
                if (!Array.isArray(albums)) throw new Error('Invalid gallery data');
                albumTitles = Object.fromEntries(albums.flatMap((album) => {
                    const entries = [];
                    if (album.album) entries.push([album.album, album.title]);
                    (album.links || []).forEach((link) => {
                        if (link.album) entries.push([link.album, `${album.title} - ${link.label}`]);
                    });
                    return entries;
                }));
                renderGalleryList(albums);
            } catch (error) {
                console.error('相簿清單載入失敗:', error);
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #d32f2f;">相簿清單載入失敗。</p>';
            }
        }

        async function loadPhotosFromJson(title, folderPath, albumKey = '', options = {}) {
            const panel = document.getElementById('gallery-panel');
            const panelTitle = document.getElementById('panel-title');
            const panelContent = document.getElementById('panel-content');
            const defaultGrid = document.getElementById('default-gallery-grid');
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            currentFolder = folderPath.endsWith('/') ? folderPath : folderPath + '/';
            currentAlbumKey = albumKey;

            panelTitle.textContent = title;
            panelContent.innerHTML = '<p style="text-align:center; padding: 50px; color: #666;">載入照片中...</p>';
            defaultGrid.style.display = 'none';
            panel.style.display = 'block';
            panel.classList.add('active');

            if (albumKey && !options.skipPush) {
                const newUrl = `${window.location.pathname}?${encodeURIComponent(albumKey)}`;
                const method = options.replace ? 'replaceState' : 'pushState';
                window.history[method]({ album: albumKey }, '', newUrl);
            }

            if (!options.skipScroll) {
                panel.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
            }

            try {
                const response = await fetch(currentFolder + 'photos.json');
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const data = await response.json();
                currentPhotoList = Array.isArray(data) ? data : (data.photos || []);

                if (currentPhotoList.length === 0) {
                    panelContent.innerHTML = '<p style="text-align:center; padding: 30px; color: #888;">此相冊暫無照片。</p>';
                    return;
                }

                const cards = currentPhotoList.map((photo, index) => {
                    const imgUrl = escapeHtml(resolveUrl(photo));
                    const alt = escapeHtml(photo.title || '照片');
                    return `<button type="button" class="sub-photo-card" data-index="${index}" aria-label="開啟照片 ${alt}">
                        <img src="${imgUrl}" alt="${alt}" loading="lazy">
                    </button>`;
                }).join('');
                panelContent.innerHTML = `<div class="sub-gallery-grid">${cards}</div>`;
            } catch (error) {
                console.error('載入失敗:', error);
                panelContent.innerHTML = `<p style="color:#d32f2f; text-align:center; padding: 30px;">載入照片失敗。<br><small style="color:#666;">找不到檔案：${escapeHtml(currentFolder)}photos.json</small></p>`;
            }
        }

        function copyAlbumLink() {
            const shareUrl = window.location.href;
            const done = () => showToast('已複製相冊連結');
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(shareUrl).then(done).catch(() => fallbackCopyTextToClipboard(shareUrl));
            } else {
                fallbackCopyTextToClipboard(shareUrl);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('已複製相冊連結');
            } catch (err) {
                showToast('請手動複製地址列網址');
            }
            document.body.removeChild(textArea);
        }

        function resolveUrl(photo) {
            let file = photo.src || photo.filename || photo.thumb || '';
            if (file.startsWith('http') || file.startsWith('/')) return file;
            if (!file.includes('/')) file = 'photos/' + file;
            return currentFolder + file;
        }

        function closeGalleryPanel(options = {}) {
            const panel = document.getElementById('gallery-panel');
            const defaultGrid = document.getElementById('default-gallery-grid');
            panel.classList.remove('active');
            panel.style.display = 'none';
            defaultGrid.style.display = 'grid';
            currentAlbumKey = '';
            if (!options.skipPush) {
                window.history.pushState({}, '', window.location.pathname);
            }
        }

        function getFocusable(lightbox) {
            return Array.from(lightbox.querySelectorAll('button, [href], img')).filter((el) => !el.hasAttribute('disabled'));
        }

        function openLightbox(index) {
            if (!currentPhotoList[index]) return;
            currentPhotoIndex = index;
            lastFocus = document.activeElement;
            updateLightboxImg();
            const lightbox = document.getElementById('main-lightbox');
            lightbox.classList.add('active');
            lightbox.hidden = false;
            document.getElementById('lightbox-close').focus();
        }

        function closeLightbox() {
            const lightbox = document.getElementById('main-lightbox');
            lightbox.classList.remove('active');
            lightbox.hidden = true;
            if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
        }

        function updateLightboxImg() {
            const photo = currentPhotoList[currentPhotoIndex];
            if (!photo) return;
            document.getElementById('lightboxImg').src = resolveUrl(photo);
            document.getElementById('lightboxImg').alt = photo.title || '放大照片';
            document.getElementById('lightboxInfo').textContent = `${currentPhotoIndex + 1} / ${currentPhotoList.length}`;
        }

        function nextPhoto(e) {
            if (e) e.stopPropagation();
            if (currentPhotoList.length === 0) return;
            currentPhotoIndex = (currentPhotoIndex + 1) % currentPhotoList.length;
            updateLightboxImg();
        }

        function prevPhoto(e) {
            if (e) e.stopPropagation();
            if (currentPhotoList.length === 0) return;
            currentPhotoIndex = (currentPhotoIndex - 1 + currentPhotoList.length) % currentPhotoList.length;
            updateLightboxImg();
        }

        function resolveAlbum(albumPath) {
            const normalizedPath = String(albumPath || '').replace(/^\/+|\/+$/g, '');
            const segments = normalizedPath.split('/');
            const isSafePath = normalizedPath && segments.every((segment) => (
                segment && segment !== '.' && segment !== '..' && !/[\\:?#]/.test(segment)
            ));
            if (!isSafePath) return null;

            const folder = `./gallery/${normalizedPath}/`;
            const fallbackTitle = segments[segments.length - 1].replace(/[_-]+/g, ' ');
            return {
                title: albumTitles[normalizedPath] || fallbackTitle,
                folder
            };
        }

        function openAlbumFromKey(albumKey, options) {
            const target = resolveAlbum(albumKey);
            if (!target) return;
            loadPhotosFromJson(target.title, target.folder, albumKey, options);
        }

        function checkUrlParam(options) {
            const albumParam = Array.from(new URLSearchParams(window.location.search).keys())[0] || '';
            if (resolveAlbum(albumParam)) {
                openAlbumFromKey(albumParam, options || { skipPush: true, replace: true });
            } else {
                closeGalleryPanel({ skipPush: true });
            }
        }

        document.getElementById('copy-album-btn').addEventListener('click', copyAlbumLink);
        document.getElementById('close-album-btn').addEventListener('click', () => closeGalleryPanel());
        document.getElementById('lightbox-close').addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
        document.getElementById('lightbox-prev').addEventListener('click', prevPhoto);
        document.getElementById('lightbox-next').addEventListener('click', nextPhoto);
        document.getElementById('lightboxImg').addEventListener('click', (e) => e.stopPropagation());
        document.getElementById('main-lightbox').addEventListener('click', closeLightbox);

        document.getElementById('default-gallery-grid').addEventListener('click', (e) => {
            const clickedAnchor = e.target.closest('a');
            if (clickedAnchor && !clickedAnchor.dataset.album) return;
            const link = e.target.closest('[data-album]');
            if (!link) return;
            e.preventDefault();
            openAlbumFromKey(link.getAttribute('data-album'));
        });

        document.getElementById('panel-content').addEventListener('click', (e) => {
            const card = e.target.closest('.sub-photo-card');
            if (!card) return;
            openLightbox(Number(card.dataset.index));
        });

        document.addEventListener('keydown', function (e) {
            const lightbox = document.getElementById('main-lightbox');
            const galleryPanel = document.getElementById('gallery-panel');
            if (e.key === 'Escape') {
                e.preventDefault();
                if (lightbox.classList.contains('active')) {
                    closeLightbox();
                } else if (galleryPanel.classList.contains('active')) {
                    closeGalleryPanel();
                }
                return;
            }
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'ArrowLeft') prevPhoto();
            if (e.key === 'Tab') {
                const focusable = getFocusable(lightbox);
                if (!focusable.length) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });

        window.addEventListener('popstate', () => {
            checkUrlParam({ skipPush: true, skipScroll: true });
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await loadGalleryList();
            checkUrlParam({ skipPush: true, replace: true });
        });
    </script>
</body>
</html>
