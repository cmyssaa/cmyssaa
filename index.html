<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天主教鳴遠中學校友會 | Catholic Ming Yuen Secondary School Alumni Association</title>
    <meta name="description" content="天主教鳴遠中學校友會官方網站：校友網絡、會務資訊、相簿與最新校慶活動。歡迎登記成為會員。">
    <meta property="og:title" content="天主教鳴遠中學校友會">
    <meta property="og:description" content="無論您身在何處，這裡永遠是每一位鳴遠人的家。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="logo.png">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="layout.js" defer></script>
</head>
<body class="page-home">

    <audio id="bg-audio" loop preload="metadata">
        <source src="song.mp3" type="audio/mpeg">
        <source src="song.mid" type="audio/midi">
    </audio>

    <div class="audio-player-widget">
        <span id="audio-status">🎵 校歌</span>
        <button type="button" id="audio-toggle-btn" aria-label="播放校歌">▶ 播放</button>
    </div>

    <div id="site-header"></div>
    <noscript>
        <nav><a href="index.html">首頁</a> · <a href="committee.html">幹事會</a> · <a href="gallery.html">相簿</a> · <a href="history.html">鳴遠簡史</a> · <a href="news.html">最新動態</a> · <a href="links.html">網絡專區</a></nav>
    </noscript>

    <main id="main-content">
        <section class="hero">
            <div class="hero-content">
                <h2>銘記校訓 ‧ 永續鳴遠情</h2>
                <p>歡迎回到天主教鳴遠中學校友會。無論您身在何處，這裡永遠是每一位鳴遠人的家。</p>
                <a href="https://forms.gle/wpKRLr8KXp7PDid16" target="_blank" rel="noopener noreferrer" class="btn">立即登記成為會員</a>
            </div>
        </section>

        <section class="container" id="about">
            <h2 class="section-title">校友會服務</h2>
            <div class="grid-3">
                <div class="card">
                    <h3>校友網絡重聚</h3>
                    <p>定期舉辦週年聚餐、校慶活動及跨屆別座談會，協助不同年代畢業的校友重聚，保持緊密聯繫。</p>
                </div>
                <div class="card">
                    <h3>母校傳承與支持</h3>
                    <p>設立校友獎學金，分享行業經驗與職涯指導，積極回饋母校，培育下一代鳴遠學子。</p>
                </div>
                <div class="card">
                    <h3>會務資訊公開</h3>
                    <p>提供最新校友會章程、幹事會名單、會議紀錄及財務報告，保持會務公開透明。</p>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script>
        const audio = document.getElementById('bg-audio');
        const toggleBtn = document.getElementById('audio-toggle-btn');
        const AUDIO_KEY = 'cmyssaa-audio-playing';

        function setPlayingUI(playing) {
            toggleBtn.textContent = playing ? '暫停' : '播放';
            toggleBtn.setAttribute('aria-label', playing ? '暫停校歌' : '播放校歌');
            toggleBtn.setAttribute('aria-pressed', String(playing));
            try { localStorage.setItem(AUDIO_KEY, playing ? '1' : '0'); } catch (e) {}
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play().then(() => setPlayingUI(true)).catch(() => {
                    setPlayingUI(false);
                });
            } else {
                audio.pause();
                setPlayingUI(false);
            }
        }

        toggleBtn.addEventListener('click', toggleAudio);

        try {
            if (localStorage.getItem(AUDIO_KEY) === '1') {
                audio.play().then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
            }
        } catch (e) {}
    </script>
</body>
</html>
