<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校歌 | 天主教鳴遠中學校友會</title>
    <!-- 引入共用樣式表與組件載入腳本 -->
    <link rel="stylesheet" href="styles.css">
    <script src="layout.js" defer></script>
</head>
<body class="page-song">

    <!-- 頂部導航列（由 layout.js 動態引入 header.html） -->
    <div id="site-header"></div>

    <!-- 頁面 Banner -->
    <section class="page-banner banner-photo">
        <h2>母校校歌</h2>
        <p>鳴遠精神 ‧ 代代相傳</p>
    </section>

    <!-- 校歌核心內容區塊 -->
    <main class="container">
        <div class="song-card">
            <h3 class="song-title">天主教鳴遠中學校歌</h3>

            <!-- 校歌音樂播放控制區 -->
            <div class="audio-player-box">
                <span class="audio-label">🎵 校歌欣賞：</span>
                <audio controls>
                    <source src="song.mid" type="audio/midi">
                    <source src="song.mp3" type="audio/mpeg">
                    您的瀏覽器不支援音樂播放功能。
                </audio>
            </div>

            <!-- 歌詞 -->
            <div class="lyrics-box">
                <p>讀書要不忘愛國，愛國要不忘讀書，</p>
                <p>我們要愛護學校，把惡劣的惰性剷除。</p>
                <p class="lyrics-highlight">鳴遠中學的明燈，照耀著我們的前途，</p>
                <p>除荊芟蕪的經營，開闢了康莊的通衢。</p>
                <p>我們是爭取民主自由英雄，</p>
                <p>我們是捍衛國家民族先驅，</p>
                <p>要努力我們的德學，埋頭苦幹，</p>
                <p class="lyrics-highlight">把青年的精神發抒，把青年的精神發抒。</p>
            </div>
        </div>
    </main>

    <!-- 頁尾區塊（由 layout.js 動態引入 footer.html） -->
    <div id="site-footer"></div>

</body>
</html>
